name: Bug report
description: Something's off in the plasma
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Serve
        2. …
    validations:
      required: true
  - type: input
    id: godot
    attributes:
      label: Godot version
      placeholder: 4.7.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / Ubuntu 24.04 / macOS
