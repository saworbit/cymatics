name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-import:
    name: Godot import + smoke
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p godot
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "Fetching $url"
          curl -fsSL -o godot.zip "$url"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Import project
        run: |
          set -euo pipefail
          GODOT="${{ runner.temp }}/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import --quit
        timeout-minutes: 10

      - name: Headless smoke
        run: |
          set -euo pipefail
          GODOT="${{ runner.temp }}/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --quit-after 2
        timeout-minutes: 5
